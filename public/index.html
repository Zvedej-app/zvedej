<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: aplikace na ploše iPhonu jde až pod výřez, okraje řeší safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Instalace na plochu (PWA). Cesty odpovídají experiments.baseUrl v app.json. -->
    <link rel="manifest" href="/zvedej/manifest.json" />
    <link rel="apple-touch-icon" href="/zvedej/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zvedej" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#11457E" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background: #11457e;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* stránka se nesmí posunout (iOS ji po zavření klávesnice nechával posunutou nahoru) */
      html,
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        margin: 0;
      }
      /* aplikace se posouvá jen nahoru a dolů – žádné přibližování ani posun do stran */
      html,
      body,
      #root {
        touch-action: manipulation;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      input,
      textarea {
        font-size: 16px;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // iOS Safari ignoruje user-scalable=no – zablokujeme gesto přiblížení i dvojité klepnutí
      (function () {
        var block = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', block, { passive: false });
        document.addEventListener('gesturechange', block, { passive: false });
        document.addEventListener('touchmove', function (e) { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
        // iOS po zavření klávesnice nechá celou stránku posunutou nahoru – vrátíme ji zpět
        var reset = function () {
          var a = document.activeElement;
          if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
          if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
          if (document.body.scrollTop) document.body.scrollTop = 0;
          if (document.documentElement.scrollTop) document.documentElement.scrollTop = 0;
        };
        document.addEventListener('focusout', function () { setTimeout(reset, 50); setTimeout(reset, 350); });
        window.addEventListener('scroll', function () { setTimeout(reset, 100); });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(reset, 50); });
        window.addEventListener('orientationchange', function () { setTimeout(reset, 300); });
        var last = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - last < 300) e.preventDefault();
          last = now;
        }, { passive: false });
      })();
    </script>
  </body>
</html>
